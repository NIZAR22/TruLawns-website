<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <!-- Brand green for the browser address bar on phones -->
    <meta name="theme-color" content="#166C46">
    <!-- Title and description: what search results show; the location helps local searches -->
    <title>Lawn Care in Palm Bay, FL | Tru Lawns</title>
    <meta name="description" content="Licensed and insured lawn care in Palm Bay, FL: mowing, mulch installation, hedge trimming and yard cleanups for homes and businesses in Melbourne, West Melbourne, Bayside Lakes and Malabar. Free estimates. Call <%- htmlWebpackPlugin.options.noscriptDetails.phone %>.">
    <!-- The one official address of this page (https, www) for search engines -->
    <link rel="canonical" href="<%- htmlWebpackPlugin.options.business.siteUrl %>/">

    <!-- Icons for browser tabs and phone home screens -->
    <link rel="icon" href="<%= BASE_URL %>favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="<%= BASE_URL %>apple-touch-icon.png">

    <!-- Link previews on Facebook, in text messages and on other sites -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="<%- htmlWebpackPlugin.options.business.legalName %>">
    <meta property="og:title" content="Tru Lawns | Expert Lawn Care in Palm Bay, FL">
    <meta property="og:description" content="Licensed and insured lawn care in Palm Bay, FL: mowing, mulch installation, hedge trimming and yard cleanups for homes and businesses in Melbourne, West Melbourne, Bayside Lakes and Malabar. Free estimates. Call <%- htmlWebpackPlugin.options.noscriptDetails.phone %>.">
    <meta property="og:url" content="<%- htmlWebpackPlugin.options.business.siteUrl %>/">
    <meta property="og:image" content="<%- htmlWebpackPlugin.options.business.siteUrl %>/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Business details for search engines (Schema.org), generated from src/config/business.js -->
    <script type="application/ld+json"><%= htmlWebpackPlugin.options.structuredData %></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- Icon font pinned to one version; the browser refuses the file if its contents ever change -->
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet" integrity="sha384-HphS8cQyN+eYiJ5PMbzShG6qZdRtvHPVLPkYb8JwMkmNgaIxrFVDhQe3jIbq3EZ2" crossorigin="anonymous">
  </head>
  <body>
    <!--
      Shown only when JavaScript is off: the key details, for visitors and
      for crawlers that don't run JavaScript (generated from src/config/business.js)
    -->
    <noscript>
      <h1><%- htmlWebpackPlugin.options.business.legalName %></h1>
      <p>Expert lawn care in Palm Bay, FL. Licensed and insured lawn care, mulch installation, hedge trimming, yard cleanups, tree trimming and sod installation for homes and businesses.</p>
      <p>Serving <%- htmlWebpackPlugin.options.noscriptDetails.serviceArea %>.</p>
      <p>Call <a href="tel:<%- htmlWebpackPlugin.options.business.phone %>"><%- htmlWebpackPlugin.options.noscriptDetails.phone %></a> for a free estimate.</p>
      <p><%- htmlWebpackPlugin.options.noscriptDetails.address %></p>
      <% if (htmlWebpackPlugin.options.noscriptDetails.hours) { %><p><%- htmlWebpackPlugin.options.noscriptDetails.hours %></p><% } %>
    </noscript>
    <div id="app"></div>
  </body>
</html>
